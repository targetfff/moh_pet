{% extends 'base.html' %}

{% block title %}
<title>Новый пароль</title>
{% endblock %}

{% block styles %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/pages/auth.css') }}"
>
{% endblock %}

{% block body %}
<div class="auth-page">
  <h1>Новый пароль</h1>

  <div class="auth-page__inner">
    <form
      class="auth-form"
      method="post"
    >
      <div class="form-floating">
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          placeholder="Новый пароль"
          autocomplete="new-password"
          minlength="6"
          maxlength="60"
          required
        >
        <label for="password">
          Новый пароль
        </label>
      </div>

      <div class="auth-hint">
        Минимум 6 символов. Новый пароль не должен
        совпадать с вашими персональными данными.
      </div>

      <div class="form-floating">
        <input
          type="password"
          class="form-control"
          id="password2"
          name="password2"
          placeholder="Повторите пароль"
          autocomplete="new-password"
          minlength="6"
          maxlength="60"
          required
        >
        <label for="password2">
          Повторите пароль
        </label>
      </div>

      <div class="auth-form__buttons auth-form__buttons--single">
        <button
          type="submit"
          class="btn btn-outline-success"
        >
          Сохранить новый пароль
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
