<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
        <meta name="viewport" content="width=device-width,minimum-scale=1">
		<title>Dynamic Select JS</title>
        <!-- Include the Dynamic Select stylesheet -->
        <link rel="icon" href="{{ url_for('static', filename='const/logo_moh.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/068f76ea97.js" crossorigin="anonymous"></script>
        <link href="{{url_for('static', filename='css/DynamicSelect.css')}}" rel="stylesheet" type="text/css">
	</head>
	<body>
        <h3 style="font-weight: normal;">Выберите товар</h3><br>
        <select class="form-control" id="product_to_change" name="product_to_change"
                 data-placeholder="Выберите товар" data-dynamic-select required>
            {% for el in data %}
            <option value="{{ el.id }}" class="form-control"
                    data-img="static/img/{{ el.main_image }}">{{ el.title }}</option>
            {% endfor %}
        </select><br>
        <div id="mainList">
        <div class="form-floating">
            <input type="text" class="form-control" value="{{ data[0].title }}"
                   name="title" id="title" placeholder="Название" required><br>
            <label for="title">Название</label>
        </div>
        <div id="example-select"></div><br><br>
        {% for el in cats %}
        <input class="options_for_select" hidden="hidden" id="{{ el.id }}" value="{{ el.title }}">
        {% endfor %}
        <script src="static/js/MyChoices.js"></script>
        <div class="form-floating">
            <input type="text" class="form-control" value="{{ data[0].description }}" name="description" id="description"
                   required placeholder="Краткое описание"><br>
            <label for="description">Краткое описание</label>
        </div>
        <div class="form-floating">
            <textarea class="form-control" name="full_description" id="full_description"
                      placeholder="Полное описание">{{ data[0].full_description }}</textarea><br>
            <label for="full_description">Полное описание</label>
        </div>
        <select id="photo" name="photo"></select>
        {% set a = data[0].images.strip('"[').strip(']"').replace("'", "").replace(",", "").split()%}
        {% for i in a %}
        <input hidden="hidden" class="photo_for_select" data-imggg="{{ url_for('static', filename='img/'+i) }}" data-cameraman="{{ i }}">
        {% endfor %}
        <script src="{{url_for('static', filename='js/DynamicSelect1.js')}}"></script>
        <script>
            var photo_data = []
            photos = document.querySelectorAll('.photo_for_select')
            photos.forEach(el => {
                photo_data.push({
                    value: el.dataset.cameraman,
                    img: el.dataset.imggg,
                    imgWidth: '100%',
                    imgHeight: '100%'
                });
            });
            new DynamicSelect2('#photo', {
            columns: 3,
            height: '5em',
            width: '100%',
            dropdownWidth: '30em',
            data: photo_data,
        });
        </script>
    </body>
</html>
